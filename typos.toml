files.extend-exclude = [
  "dev",
  # Spanish copy, checked against an English dictionary. "momento" (a moment)
  # is read as a misspelling of "memento", and every Spanish word added later
  # is the same coin flip. A per-word allowlist would be worse than this: it is
  # global, so it would also stop flagging those words where they ARE typos, in
  # the English files. en.json stays checked.
  "src/config/locales/es.json",
  # Nothing but a list of ISO 3166-1 alpha-2 codes. "BA" (Bosnia and
  # Herzegovina) is read as a misspelling of "BY"/"BE" — and BY is an entry in
  # that same list, so accepting the suggestion would silently change which
  # country the SMS-pumping gate blocks and duplicate an existing entry. The
  # list was split out of src/config/schema.ts so this suppression covers the
  # data only: schema.ts keeps full spell checking, and no repo-global
  # extend-words entry is needed (which would stop flagging "BA" everywhere).
  "src/config/blocked-countries.ts",
  "src/domain/users/languages.ts",
  "src/services/loopd/protos",
  "docs/postman-collection/galoy_graphql_main_api.postman_collection.json",
  "docker-compose.yml",
  "quickstart/*.yml"
]

default.extend-ignore-identifiers-re = [
  "^bc1\\w+",
  "^lnbc1\\w+",
]

default.extend-ignore-re = ["\"eyJ[a-zA-Z0-9_\\-\\.]+\""]

[default.extend-words]
# returned from twilio API referenced in src/debug/text-sms.ts
Ons = "Ons"
Lsat = "Lsat"
# Bridge API payment rail token
bre = "bre"
# MongoDB query operator
nin = "nin"
# Existing money quiz identifiers; changing them would be a cross-client data change.
Governement = "Governement"
Aggrement = "Aggrement"
