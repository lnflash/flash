# future admins should be added via admin-api.
admin_accounts:
  - role: "bankowner"
    phone: "+16505554334"

ibex:
  clientId: ""
  clientSecret: ""
  environment: "sandbox"
  webhook:
    uri: "" # external uri defined in overrides
    port: 4008
    secret: "7189c07e9a60977492c9471a527b0d9040c1fa3c5b7bfd7e87e58db018160ddb"  # dev-only; deployed envs override; placeholders are refused at request time
    # Ibex's published source IPs / CIDRs for webhook delivery. Populate in
    # production overrides to enforce the allowlist; empty disables it (ISL-112).
    allowedIps: []

fygaro:
  enabled: false # flags-off baseline; enable per environment via config overrides
  webhook:
    port: 4010
    timestampSkewMs: 300000
    # HMAC shared secrets keyed by the Fygaro-Key-ID header value.
    # Real secrets injected via config overrides; never commit a real secret.
    secrets: {}
  credit:
    # Phase gate: with credit OFF the webhook only records the payment and
    # notifies ops; the treasury -> user transfer stays manual.
    enabled: false
  float:
    # Alert (cron) when the bankowner treasury USDT balance — the auto-credit
    # funding source — drops below this floor, in USD. Default ~4x the $500
    # auto-credit limit so ops has runway to top up before the well runs dry.
    floorUsd: 2000

bridge:
  enabled: false # flags-off baseline; enable per environment via config overrides
  apiKey: "" # real key injected via config overrides; never commit a real key
  baseUrl: "https://api.sandbox.bridge.xyz/v0"
