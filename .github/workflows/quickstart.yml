name: "Quickstart"

on:
  pull_request:
    branches: [main, tmp/bridge-rebase-pr-ready]

jobs:
  integration:
    name: Quickstart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: carvel-dev/setup-action@v1
        with:
          only: ytt, vendir
          # ytt v0.55.2's release notes use a single space in checksum
          # lines; setup-action needs the sha256sum two-space format and
          # fails verification. Pin until a fixed release lands upstream.
          ytt: v0.55.1
      - name: Test quickstart
        run: |
          cd quickstart
          ./bin/bump-galoy-image-digest.sh local
          ./bin/bump-mongodb-migrate-image-digest.sh local
          make re-render
          source .envrc
          docker compose up -d
          ./bin/quickstart.sh
